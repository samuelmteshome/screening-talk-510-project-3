name: train all models (final test-set run)
# Downloads and cleans the public NHANES files, trains the prostate, heart and colorectal
# models, scores each once on its held-out test cycles, and commits the metrics, model
# cards and calibration charts to models/<topic>/ plus docs/models/results.md.
# Model files (.joblib) and run folders are kept as a workflow artifact, not in git.
# Every run is tracked in MLflow; mlflow.db and mlruns/ are kept in the workflow artifact
# (download it and run `mlflow ui --backend-store-uri sqlite:///mlflow.db`).
on:
  workflow_dispatch:
  push:
    branches: ["sam/train-**"]
    paths: [".github/workflows/train-models.yml", "src/train.py", "src/train_heart.py", "src/features.py", "topics/*.yaml"]
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Heart (validation, then test)
        run: |
          python -m src.data.download --topic heart
          python -m src.data.clean --topic heart
          python -m src.train_heart --final
      - name: Prostate and colorectal (validation run, then final test run)
        run: |
          for t in prostate colorectal; do
            python -m src.data.download --topic $t
            python -m src.data.clean --topic $t
            python -m src.train --topic $t --data-uri data/clean/$t/clean.parquet --allow-unverified --no-upload
            val=$(ls -td runs/*/ | head -1)
            python -m src.train --topic $t --data-uri data/clean/$t/clean.parquet --allow-unverified --no-upload --final
            test=$(ls -td runs/*/ | head -1)
            mkdir -p models/$t
            cp "$val/metrics.json" models/$t/metrics_val.json
            cp "$test/metrics.json" "$test/model_card.json" "$test/run_metadata.yaml" models/$t/
            cp "$test/calibration.png" models/$t/calibration_test.png
            cp "$test/model.joblib" models/$t/model.joblib
          done
      - run: python scripts/results_table.py
      - name: Screenshot the MLflow runs for the README
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/mlflow_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: models-and-runs
          path: |
            models/
            runs/
            mlflow.db
            mlruns/
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/*/model.joblib   # small logistic models; the API and local demo run without the bucket
          git add models/*/*.json models/*/*.yaml models/*/*.png docs/models docs/mlflow data/raw/MANIFEST.json docs/cleaning 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Final test-set results for all models [skip ci]"
          git pull --rebase -q && git push
